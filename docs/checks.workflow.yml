name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sprite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pillow>=11,<12' 'numpy>=2,<3' pytest
      - run: python -m pytest tests -q
        working-directory: spritefy
      - run: python scripts/configure.py && docker compose -f compose.json config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run tests/body-measurements.test.ts tests/outfit-quests.test.ts tests/inventory.test.ts tests/garment-details.test.ts tests/garment-bonuses.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
